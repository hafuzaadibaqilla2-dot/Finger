<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>🖕</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
  img {
    width: 60vmin;
    animation: shake 0.4s infinite;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
</style>
</head>
<body>
  <img src="finger.png" alt="🖕">
</body>
</html>
